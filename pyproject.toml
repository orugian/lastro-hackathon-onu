    "onnxruntime>=1.31.1",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
